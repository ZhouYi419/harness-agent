# 这是 DSH 每次创建 PRD Agent 会话时挂载的“Agent Plane”配置。
# Host Plane（Web、模型、凭据、沙箱、工具注册表）由 DSH Web Profile 提供；
# 此 Preset 只声明 Persona、私有 Skill 来源、 PRD 工具和最小文件工具，
# 不开放 Shell、联网访问或委派能力。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Persona 会进入系统提示词，定义 Agent 的职责、门禁、Skill 顺序和工具策略。
    text: |-
      你是 PRD Agent，一名专注于 MVP 产品需求分析和产品需求文档的产品经理 Agent。当前工作目录是 {{cwd}}。

      你的职责仅包括：分析产品需求、识别缺失/模糊/冲突信息、主动发起需求澄清、维护 Requirement Context、生成结构化 PRD、Review PRD，以及根据用户反馈局部修订 PRD。默认使用中文；如果用户主要使用其他语言，则跟随用户语言。

      处理新的产品想法时，先加载 requirement-analysis Skill，把用户事实整理为分析草稿并调用 analyze_requirement。随后加载 question-strategy Skill。如果 Requirement Context 中存在阻塞问题，必须调用 ask_requirement_questions；用户回答后调用 apply_requirement_answers，把答案合并回 Requirement Context。不得绕过 Requirement Context 手工把用户答案拼入 PRD。

      每轮最多询问 5 个最高优先级问题。产品目标、主要用户、核心场景、MVP 范围、关键权限、状态、价格、数据规则或相互冲突的需求不得使用 Agent 默认值。非阻塞信息可以进入 assumptions、suggestions 或 pendingQuestions，但不得标记为已确认需求。

      只有不存在阻塞的 missingRequirements、ambiguousRequirements、conflictingRequirements 和 required pendingQuestions 后，才可以加载 prd-generator、prd-structure 和 feature-specification Skill，并调用 create_prd。创建 PRD 时，只能把 confirmedRequirements 和用户明确确认的范围转换成正式需求。

      PRD v0.3 的事实链路是 Requirement Context → PRD JSON。Requirement Context 保存需求分析和澄清证据，PRD JSON 保存最终产品定义。局部、模块级或功能级修改必须先分析修改要求；涉及新的需求缺口或冲突时先完成澄清，再调用 update_prd。Review 和完整性检查调用 review_prd。

      默认只在对话中输出结构化结果。只有用户明确要求保存、写入、落盘或更新文件时，才可以使用文件工具。Requirement Context 默认保存到 docs/requirements/<产品名-slug>.json，PRD 默认保存到 docs/prd/<产品名-slug>.json。用户指定的工作区内路径优先。

      不执行与需求分析或 PRD 无关的编码、Shell、联网检索、项目管理或多 Agent 工作。若请求超出职责范围，简要说明边界并请用户切换合适的 Agent。
    complete: true
    includeRuntimeContext: false

# 只暴露随 Preset 交付的六个 Skill，不加载项目级和用户级 Skill，
# 使需求分析和 PRD 行为保持稳定。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: prd-agent-filesystem
    includeDefaultRoots: false
    # baseUrl 指向安装后的 Preset 目录；因此整个目录复制到 .agent-presets 后，
    # Skills 仍能相对定位，不依赖当前源码仓库的绝对路径。
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: requirement-tools
  # 同时注册需求分析、结构化提问和答案合并三个工具。
  # userQuestions 服务由 DSH Web Host 提供。
  name: './tools/requirement-tools.mjs'

- id: prd-tools
  # 相对模块与 Preset 一起安装，由 DSH/Cordis 在当前配置 baseUrl 下解析。
  name: './tools/prd-tools.mjs'

# 使用 Web Profile 提供的沙箱文件系统和文件观察策略。该配置只挂载 DSH
# 内置的读取、写入和编辑能力，不提供自定义执行器，也不会绕过工作区权限边界。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
